<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRIMAL · Centro de mando</title>
<meta name="description" content="Centro de mando financiero de Primal Growth: finanzas personales y del negocio en un solo lugar." />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23050505'/><text x='32' y='46' text-anchor='middle' font-family='Didot,Bodoni 72,Georgia,serif' font-style='italic' font-weight='700' font-size='40' fill='%23D4AF5A'>P</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Manrope:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-palette="#D4AF5A,#D9263F,#F3EEE4">
<div class="shell">

  <!-- ===== BARRA DE MANDO ===== -->
  <header class="cmdbar">
    <div class="brand" title="Primal Growth">
      <div class="word"><b id="brand-name">PRIMAL</b><span id="brand-sub">Centro de mando</span></div>
    </div>

    <div class="seg red hidden" id="scope-seg" role="tablist" aria-label="Ámbito"><button data-scope="negocio" class="active">Negocio</button></div>

    <div class="monthnav">
      <button id="m-prev" title="Mes anterior">‹</button>
      <span class="lbl" id="m-lbl">OCT 2026</span>
      <button id="m-next" title="Mes siguiente">›</button>
    </div>

    <div class="cmd-spacer"></div>
    <div class="status"><span class="dot local" id="db-dot"></span><span id="db-txt">Local</span></div>
  </header>

  <nav class="views" id="views">
    <button data-view="mando" class="active">Mando</button>
    <button data-view="movs">Caja <span class="n" id="n-movs"></span></button>
    <button data-view="growth">Growth <span class="n" id="n-cobros"></span></button>
    <button data-view="consultoria">Consultoría</button>
    <button data-view="cuotas">Cuotas <span class="n" id="n-cuotas"></span></button>
    <button data-view="recurrentes">Recurrentes</button>
    <button data-view="config">Config</button>
  </nav>

  <!-- ===== VISTAS ===== -->
  <main id="view-mando" class="view"></main>
  <main id="view-movs" class="view hidden"></main>
  <main id="view-growth" class="view hidden"></main>
  <main id="view-consultoria" class="view hidden"></main>
  <main id="view-cuotas" class="view hidden"></main>
  <main id="view-recurrentes" class="view hidden"></main>
  <main id="view-config" class="view hidden"></main>
</div>

<!-- modal -->
<div id="modal-bg">
  <div id="modal" role="dialog" aria-modal="true">
    <div class="mh"><h2 id="m-title"></h2><button id="m-close" aria-label="Cerrar">×</button></div>
    <div class="mb" id="m-body"></div>
    <div class="mf"><div id="m-left"></div><div id="m-right"></div></div>
  </div>
</div>
<div id="toast"></div>
<div class="tip" id="tip"></div>

<script src="app.js"></script>
</body>
</html>
